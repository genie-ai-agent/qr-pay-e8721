<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Pay — Wobbles Cafe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="hdr">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">Wobbles Cafe</span>
      </div>
      <a class="hdr-link subtle" href="#settings" id="openSettings">Settings</a>
    </header>

    <div class="menu">
      <div class="menu-head">
        <p class="section-label">Tap to add</p>
        <span class="brand-tag">Menu</span>
      </div>
      <div class="menu-scroll" id="menuScroll"></div>
    </div>

    <section class="panel">
      <p class="panel-label">New charge</p>
      <form id="chargeForm" autocomplete="off">
        <label class="field">
          <span class="field-label">Amount</span>
          <div class="amount-row">
            <span class="currency">$</span>
            <input id="amount" type="text" inputmode="decimal" placeholder="0.00" required />
            <button type="button" id="clearAmount" class="amount-clear" title="clear">Clear</button>
          </div>
        </label>

        <label class="field">
          <span class="field-label">Note <span class="hint">what's it for?</span></span>
          <div class="note-row">
            <input id="note" type="text" placeholder="iced latte" />
            <button type="button" id="micBtn" class="mic" aria-label="speak note" title="speak note">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
            </button>
          </div>
          <span class="mic-status" id="micStatus"></span>
        </label>

        <button type="submit" class="btn-primary">Generate QR →</button>
      </form>
    </section>

    <section class="panel qr-panel hidden" id="qrPanel">
      <p class="panel-label">Scan to pay</p>
      <div class="qr-amount" id="qrAmount"></div>
      <div class="qr-note" id="qrNote"></div>
      <div class="qr-box">
        <div id="qrCanvas"></div>
      </div>
      <div class="url-row">
        <code id="payUrl"></code>
      </div>
      <div class="actions">
        <button type="button" id="copyBtn" class="btn-ghost">Copy link</button>
        <button type="button" id="downloadBtn" class="btn-ghost">Download</button>
        <a id="openBtn" class="btn-ghost" target="_blank" rel="noopener">Open</a>
      </div>
    </section>

    <section class="panel settings" id="settings">
      <p class="panel-label">Settings — saved on this device</p>
      <label class="field">
        <span class="field-label">Venmo handle <span class="hint">without the @</span></span>
        <input id="venmoHandle" type="text" placeholder="iqram" />
      </label>
      <label class="field">
        <span class="field-label">Jelly username</span>
        <input id="jellyHandle" type="text" placeholder="acafe" />
      </label>
      <button type="button" id="saveSettings" class="btn-primary">Save</button>
      <div class="save-status" id="saveStatus"></div>
    </section>

    <footer class="ftr">
      Wobbles Cafe · Venmo · Jelly
    </footer>
  </main>

  <script src="qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
